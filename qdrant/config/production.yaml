# Qdrant Production Configuration for Knowledge OS

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  enable_cors: true
  max_request_size_mb: 32
  max_connections: 1000

storage:
  storage_path: ./storage
  snapshots_path: ./snapshots
  on_disk_payload: true
  
  performance:
    max_search_threads: 0
    max_optimization_threads: 0
  
  optimizers:
    indexing_threshold_kb: 20000
    optimizer_interval_sec: 10
    max_segment_number: 6
    segments_per_thread: 2
    memmap_threshold_kb: 200000
  
  wal:
    wal_capacity_mb: 32
    wal_segments_ahead: 0

hnsw:
  m: 16
  ef_construct: 100
  full_scan_threshold_kb: 10000
  max_indexing_threads: 0
  on_disk: false
  payload_m: 16

quantization:
  scalar:
    type: int8
    quantile: 0.99
    always_ram: true
  
  product:
    compression: x16
    always_ram: false
  
  binary:
    encoding: two_bits
    always_ram: true

telemetry_disabled: false
