version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: knowledge-os-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
      - ./backups/snapshots:/qdrant/snapshots
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/snapshots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - knowledge-os-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge-os-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=sqlite:///app/data/knowledge_os.db
      - OPENCLAW_URL=${OPENCLAW_URL:-http://host.docker.internal:18789}
      - OPENCLAW_TOKEN=${OPENCLAW_TOKEN:-}
      - BACKUP_PATH=/app/backups
      - WATCHED_FOLDERS_PATH=/app/data/watched_folders.json
    volumes:
      - backend-data:/app/data
      - ./backups:/app/backups
      # Mount host directories for file watching (configure as needed)
      - ${HOME}/Documents:/host/documents:ro
      - ${HOME}/Projects:/host/projects:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - knowledge-os-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend (served via nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-os-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - knowledge-os-network

  # File Watcher Service (optional - can also run in backend)
  file-watcher:
    build:
      context: ./backend
      dockerfile: Dockerfile.watcher
    container_name: knowledge-os-file-watcher
    environment:
      - BACKEND_URL=http://backend:8000
      - WATCH_INTERVAL=5
    volumes:
      - ${HOME}/Documents:/host/documents:ro
      - ${HOME}/Projects:/host/projects:ro
      - file-watcher-data:/app/data
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - knowledge-os-network
    profiles:
      - with-watcher  # Only start when explicitly requested

volumes:
  qdrant-storage:
    driver: local
  backend-data:
    driver: local
  file-watcher-data:
    driver: local

networks:
  knowledge-os-network:
    driver: bridge

